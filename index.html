    <style>
      /* Critical: the page-transition curtain must never flash unstyled. */
      .rt-curtain { position: fixed; inset: 0; z-index: 2000; visibility: hidden; pointer-events: none; }
      .rt-curtain-panel { position: absolute; inset: 0; background: #171a18; transform: translateY(112%); }
      .rt-curtain-edge { position: absolute; left: 0; width: 100%; height: 100px; fill: #171a18; }
      html.rt-page-entering .rt-curtain { visibility: visible; }
      html.rt-page-entering .rt-curtain-panel { transform: none; }
    </style>
  </head>
  <body>
    <div class="rt-curtain" data-page-curtain aria-hidden="true">
      <div class="rt-curtain-panel" data-curtain-panel>
        <svg class="rt-curtain-edge rt-curtain-edge--top" data-curtain-edge-top viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0 120 C300 0 1140 0 1440 120 Z" /></svg>
        <span class="rt-curtain-label" data-curtain-label></span>
        <svg class="rt-curtain-edge rt-curtain-edge--bottom" data-curtain-edge-bottom viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0 0 H1440 C1140 120 300 120 0 0 Z" /></svg>
      </div>
    </div>
    <script>
      try {
        var rtNext = sessionStorage.getItem("rt-page-transition");
        if (rtNext && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.documentElement.classList.add("rt-page-entering");
          document.querySelector("[data-curtain-label]").textContent = rtNext;
          setTimeout(function () {
            document.documentElement.classList.remove("rt-page-entering");
          }, 4500);
        }
      } catch (error) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
